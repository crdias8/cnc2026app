<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8B0000">
<title>Painel de Acessos CNC</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600&family=Sora:wght@400;600;700&display=swap">
<style>
:root{
  --brand:#8B0000; --brand-2:#C10000; --brand-deep:#5A0000; --gold:#F2C230;
  --nav:#141414; --nav-fg:#F2F2F2; --nav-muted:#A9A9A9;
  --bg:#F6F2F1; --surface:#FFFFFF; --surface-2:#F1EAE9; --fg:#1C1516; --muted:#6B5F60; --line:#E4D8D7;
  --accent:#A30F12; --bar:#B3151A; --bar-soft:#F0D3D0; --grid:#EDE3E2;
  --shadow:0 1px 2px rgba(60,10,10,.06),0 4px 14px rgba(60,10,10,.05);
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120E0E; --surface:#1C1617; --surface-2:#251E1F; --fg:#F2EBEB; --muted:#AD9FA0; --line:#352B2C;
  --accent:#F0857A; --bar:#E8605A; --bar-soft:#3A2223; --grid:#2C2324; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120E0E; --surface:#1C1617; --surface-2:#251E1F; --fg:#F2EBEB; --muted:#AD9FA0; --line:#352B2C;
  --accent:#F0857A; --bar:#E8605A; --bar-soft:#3A2223; --grid:#2C2324; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
header{background:var(--brand);color:#fff}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
header img{height:36px;width:auto;display:block}
header .ttl{margin-left:auto;text-align:right;font-size:13px;line-height:1.25;opacity:.92}
nav.bar{background:var(--nav);color:var(--nav-fg)}
nav.bar .wrap{display:flex;gap:18px;align-items:center;min-height:44px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:15px;overflow-x:auto;white-space:nowrap}
nav.bar a{color:var(--nav-muted);text-decoration:none;padding:10px 0;border-bottom:3px solid transparent}
nav.bar a.on{color:#fff;border-bottom-color:#EC7969}
.hero{background:radial-gradient(120% 90% at 85% 10%,var(--brand-2) 0%,var(--brand) 45%,var(--brand-deep) 100%);color:#fff;position:relative;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.hero .wrap{position:relative;padding-block:26px 24px}
.eyebrow{font-family:var(--f-display);font-weight:300;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:#FFD7CF}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,6vw,44px);line-height:1.04;margin:6px 0 8px;text-transform:uppercase;letter-spacing:.01em}
.hero p{margin:0;max-width:60ch;opacity:.95}
.hero .upd{margin-top:12px;font-size:13px;opacity:.9}
main{padding-block:18px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:13px;color:var(--muted)}
.kpi .num{font-family:var(--f-display);font-weight:500;font-size:38px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.split{height:8px;border-radius:4px;background:var(--bar-soft);margin-top:8px;overflow:hidden;display:flex;gap:2px}
.split i{display:block;height:100%;background:var(--bar);border-radius:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:14px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:18px;margin:0;color:var(--accent)}
.card .hint{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.cardhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.slot{border-top:1px solid var(--line);padding:12px 0 6px}
.slot:first-child{border-top:0;padding-top:2px}
.slothead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.slothead .hr{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.slothead .tot{font-size:12.5px;color:var(--muted)}
.slothead .conc{font-size:11.5px;font-weight:600;color:#fff;background:var(--accent);border-radius:999px;padding:2px 9px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:5px 0}
.srow .nm{font-size:14px;line-height:1.35}
.srow .nm b{font-weight:600}
.srow .mt{font-size:12px;color:var(--muted);grid-column:1}
.srow .ct{grid-row:1/span 2;grid-column:2;align-self:center;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.srow .tr{grid-column:1/-1;height:6px;border-radius:3px;background:var(--bar-soft);overflow:hidden}
.srow .tr i{display:block;height:100%;background:var(--bar);border-radius:3px}
.srow .tr.lv-ok i{background:#2E9E4F}.srow .tr.lv-warn i{background:#E0A800}.srow .tr.lv-over i{background:#FF1A1A}
.srow.alerta{background:#FFF4CC;border-left:4px solid #E0A800;border-radius:8px;padding:6px 8px;margin:3px -8px}
.srow .cap{grid-column:1/-1;font-size:12.5px;font-weight:700;color:#7A5200;margin-top:2px}
.slothead .alc{font-size:11.5px;font-weight:700;color:#5C3D00;background:#FFD54A;border-radius:999px;padding:2px 9px}
.alertsum{background:#FFF4CC;border:1px solid #E0A800;border-radius:10px;padding:8px 12px;font-size:13.5px;color:#5C3D00;margin:0 0 10px}

.slot details summary{cursor:pointer;font-size:13px;color:var(--accent);margin-top:4px}
.cardhead .seg{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 14px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:240px;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--nav);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.chart .tip b{font-family:var(--f-display);font-weight:500;font-size:15px}
.axis text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.axis line{stroke:var(--grid)}
.rows{display:grid;gap:7px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px;align-items:baseline}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ct{font-variant-numeric:tabular-nums;font-weight:600}
.row .tr{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.row .tr i{display:block;height:100%;background:var(--bar);border-radius:4px;min-width:4px}
.empty{color:var(--muted);font-size:13.5px;font-style:italic;padding:6px 0}
.notice{background:#FFF4D6;border:2px solid #E8A400;color:#2a1a00;border-radius:var(--r);padding:14px 16px;margin-top:14px}
.notice h2{font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:18px;margin:0 0 4px;color:#8B0000}
.notice p{margin:0}
details.tbl{margin-top:10px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--accent);font-weight:600}
details.tbl table{border-collapse:collapse;margin-top:6px;width:100%}
details.tbl td,details.tbl th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
details.tbl td:last-child,details.tbl th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.mapwrap{grid-template-columns:1fr}}
.map{position:relative}
.map svg{display:block;width:100%;height:auto;max-height:520px}
.map path{stroke:var(--surface);stroke-width:1.6;stroke-linejoin:round;transition:opacity .1s}
.map path.on{stroke:var(--fg);stroke-width:2.4}
.map text{font-size:15px;font-family:var(--f-body);font-weight:600;pointer-events:none}
.map .tip{position:absolute;pointer-events:none;background:var(--nav);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0}
.map .tip b{font-family:var(--f-display);font-weight:500;font-size:15px}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend .sw{display:flex;gap:2px}.legend .sw i{width:26px;height:12px;border-radius:3px;display:block}
.legend .zero{width:14px;height:12px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);display:inline-block;vertical-align:-2px;margin-right:4px}
footer{color:var(--muted);font-size:12.5px;margin-top:22px;line-height:1.6}
@media (max-width:520px){ .kpi .num{font-size:32px} header img{height:30px} .chart svg{height:200px} }
</style>
</head>
<body>
<header><div class="wrap"><img src="mark.webp" alt="CNC 2026" width="306" height="116"><div class="ttl"><b>Painel de acessos</b><br>App da Programação</div></div></header>
<nav class="bar"><div class="wrap"><a href="#" class="on">Painel</a><a href="https://crdias8.github.io/cnc2026app/" target="_blank" rel="noopener">Abrir o app</a></div></nav>
<div class="hero"><canvas id="mesh" aria-hidden="true"></canvas><div class="wrap">
  <div class="eyebrow">XXVIII Congresso Nacional de Criminalística · 27 a 30/10/2026 · Gramado/RS</div>
  <h1>Painel de acessos do app</h1>
  <p>Como os congressistas estão usando a programação oficial: quantos acessos, de onde, por qual aparelho e o que mais procuram.</p>
  <div class="upd" id="upd">Carregando…</div>
</div></div>
<main class="wrap" id="main"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => (n||0).toLocaleString('pt-BR');
const pad = n => String(n).padStart(2,'0');
const fmtDT = iso => { const d = new Date(iso); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' às '+pad(d.getHours())+':'+pad(d.getMinutes()); };

/* nomes em português para o que vem em inglês */
const SYS = {'iOS':'iPhone/iPad (iOS)','Android':'Android','Windows':'Windows','macOS':'Mac (macOS)','Linux':'Linux','Chrome OS':'Chromebook'};
const COUNTRY = {'BR':'Brasil','PT':'Portugal','US':'Estados Unidos','AR':'Argentina','UY':'Uruguai','PY':'Paraguai','CL':'Chile'};
const SIZE = {'phone':'Celular','largephone':'Celular grande','tablet':'Tablet','desktop':'Computador','desktophd':'Computador (tela grande)','unknown':'Desconhecido'};
const UF_NAME = {AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};
const normTxt = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const UF_BY_NAME = Object.fromEntries(Object.entries(UF_NAME).map(([k,v]) => [normTxt(v), k]));
UF_BY_NAME['federal district'] = 'DF'; UF_BY_NAME['sao paulo'] = 'SP';
function ufOf(x){ const id = String(x.id||'').toUpperCase(); const m = id.match(/^BR-?([A-Z]{2})$/); if (m && UF_NAME[m[1]]) return m[1]; if (UF_NAME[id]) return id; return UF_BY_NAME[normTxt(x.name)] || ''; }
/* rampa sequencial (um só tom, do claro ao escuro) */
const RAMP_L = ['#F6D9D5','#EBA79F','#D86A61','#B3151A','#6E0000'], RAMP_D = ['#4A2425','#7A2E2E','#B0413D','#E0605A','#FF9C93'];
const dark = () => matchMedia('(prefers-color-scheme: dark)').matches;
let GEO = null;
async function loadGeo(){
  if (GEO) return GEO;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const topo = await fetch('https://cdn.jsdelivr.net/npm/@highcharts/map-collection@2.3.0/countries/br/br-all.topo.json').then(r => r.json());
  const fc = topojson.feature(topo, topo.objects.default);
  const k = Math.cos(-15*Math.PI/180), P = ([lon,lat]) => [lon*k, -lat];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const each = (g, fn) => (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(p => p.forEach(r => fn(r)));
  fc.features.forEach(f => each(f.geometry, r => r.forEach(c => { const [x,y] = P(c); x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); })));
  const W = 1000, s = W/(x1-x0), H = Math.round((y1-y0)*s);
  const ufs = {};
  fc.features.forEach(f => { let d = ''; each(f.geometry, r => { d += 'M' + r.map(c => { const [x,y] = P(c); return ((x-x0)*s).toFixed(1)+','+((y-y0)*s).toFixed(1); }).join('L') + 'Z'; });
    const uf = f.properties['postal-code']; const [cx,cy] = P([f.properties['hc-middle-lon'], f.properties['hc-middle-lat']]); ufs[uf] = {d, c:[(cx-x0)*s, (cy-y0)*s]}; });
  return GEO = {W, H, ufs};
}
async function drawMap(byUF){
  const el = $('#map'), leg = $('#mapleg'); if (!el) return;
  let g; try { g = await loadGeo(); } catch(e){ el.innerHTML = '<div class="empty">Não foi possível carregar o mapa agora.</div>'; return; }
  const ramp = dark() ? RAMP_D : RAMP_L;
  const vals = Object.entries(byUF).filter(([k]) => UF_NAME[k]).map(([,v]) => v); const mx = Math.max(1, ...vals);
  const step = v => v <= 0 ? -1 : mx <= 1 ? 4 : Math.min(4, Math.floor(Math.log(v)/Math.log(mx+0.0001)*4.999)); // escala logarítmica: diferenças pequenas também aparecem
  const small = new Set(['DF','SE','AL','PB','RN','ES','RJ','SC']);
  let paths = '', labels = '';
  Object.entries(g.ufs).forEach(([uf, o]) => {
    const v = byUF[uf] || 0, st = step(v), fill = st < 0 ? 'var(--surface-2)' : ramp[st];
    paths += `<path d="${o.d}" fill="${fill}" data-uf="${uf}" data-v="${v}"/>`;
    if (!small.has(uf) || v > 0) labels += `<text x="${o.c[0].toFixed(0)}" y="${(o.c[1]+5).toFixed(0)}" text-anchor="middle" fill="${st >= 3 ? '#fff' : 'var(--muted)'}">${uf}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${g.W} ${g.H}" role="img" aria-label="Mapa do Brasil com acessos por estado">${paths}${labels}</svg><div class="tip"></div>`;
  const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
  const show = ev => { const p = ev.target.closest('path'); svg.querySelectorAll('path.on').forEach(x => x.classList.remove('on')); if (!p){ tip.style.opacity = 0; return; }
    p.classList.add('on'); p.parentNode.insertBefore(p, p.parentNode.querySelector('text'));
    const r = el.getBoundingClientRect(); const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left, cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    tip.innerHTML = `${esc(UF_NAME[p.dataset.uf])}<br><b>${nf(+p.dataset.v)}</b> acessos`; tip.style.left = cx+'px'; tip.style.top = cy+'px'; tip.style.opacity = 1; };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerleave', () => { tip.style.opacity = 0; svg.querySelectorAll('path.on').forEach(x => x.classList.remove('on')); });
  svg.addEventListener('touchstart', show, {passive:true});
  leg.innerHTML = `<span><i class="zero"></i>sem acessos</span><span>menos</span><span class="sw">${ramp.map(c => `<i style="background:${c}"></i>`).join('')}</span><span>mais (máx. ${nf(mx)})</span>`;
}
const REF = n => !n ? 'Acesso direto (link digitado, QR code, app instalado)' : n.replace(/^https?:\/\//,'');

function drawMesh(){
  const c = $('#mesh'); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio||1);
  c.width = r.width*dpr; c.height = r.height*dpr;
  const x = c.getContext('2d'); x.scale(dpr,dpr);
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const W = r.width, H = r.height, pts = [], n = Math.round(Math.min(80, W/10));
  for (let i=0;i<n;i++) pts.push([W*0.45 + rnd()*W*0.58, rnd()*H]);
  x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = .7;
  for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){ const dx=pts[i][0]-pts[j][0], dy=pts[i][1]-pts[j][1]; if (dx*dx+dy*dy < 70*70){ x.beginPath(); x.moveTo(...pts[i]); x.lineTo(...pts[j]); x.stroke(); } }
  pts.forEach(([px,py],i) => { x.fillStyle = i%11===0 ? '#F2C230' : 'rgba(255,255,255,.8)'; x.beginPath(); x.arc(px,py,i%11===0?2.6:1.6,0,7); x.fill(); });
}

function rows(list, opts={}){
  const l = list.filter(x => x.count > 0).slice(0, opts.max || 10);
  if (!l.length) return '<div class="empty">Ainda sem dados.</div>';
  const mx = Math.max(...l.map(x => x.count));
  return '<div class="rows">' + l.map(x => `<div class="row" title="${esc(x.name)}: ${nf(x.count)}"><span class="nm">${esc(x.name)}</span><span class="ct">${nf(x.count)}</span><span class="tr"><i style="width:${(x.count/mx*100).toFixed(1)}%"></i></span></div>`).join('') + '</div>' +
    `<details class="tbl"><summary>Ver em tabela</summary><table><thead><tr><th>${esc(opts.col||'Item')}</th><th>Acessos</th></tr></thead><tbody>${list.filter(x=>x.count>0).map(x=>`<tr><td>${esc(x.name)}</td><td>${nf(x.count)}</td></tr>`).join('')}</tbody></table></details>`;
}
function card(title, hint, body, extra=''){ return `<section class="card"><div class="cardhead"><div><h2>${title}</h2>${hint?`<p class="hint">${hint}</p>`:''}</div>${extra}</div>${body}</section>`; }

/* série temporal a partir de stats.total.days (horário local configurado no GoatCounter) */
function series(days, mode){
  const pts = [];
  (days||[]).forEach(d => {
    if (mode === 'dia') pts.push({ label: d.day.slice(8,10)+'/'+d.day.slice(5,7), v: d.daily || (d.hourly||[]).reduce((a,b)=>a+b,0) });
    else (d.hourly||[]).forEach((v,h) => pts.push({ label: d.day.slice(8,10)+'/'+d.day.slice(5,7)+' '+pad(h)+'h', day: d.day, h, v }));
  });
  if (mode !== 'dia'){ // corta horas futuras do último dia
    const now = new Date(); const today = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
    while (pts.length && pts[pts.length-1].day === today && pts[pts.length-1].h > now.getHours()) pts.pop();
    while (pts.length > 1 && pts[0].v === 0 && pts[1].v === 0) pts.shift();
  }
  return pts;
}
function lineChart(el, pts){
  const W = el.clientWidth || 600, H = el.querySelector('svg') ? el.querySelector('svg').clientHeight || 240 : 240;
  const m = {l:34, r:10, t:12, b:26}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  if (!pts.length){ el.innerHTML = '<div class="empty">Ainda sem dados.</div>'; return; }
  const mx = Math.max(4, ...pts.map(p=>p.v)); const nice = Math.ceil(mx/4)*4;
  const X = i => m.l + (pts.length===1 ? iw/2 : i*iw/(pts.length-1)), Y = v => m.t + ih - v/nice*ih;
  let g = '';
  for (let k=0;k<=4;k++){ const v = nice*k/4, y = Y(v); g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${nf(v)}</text>`; }
  const step = Math.max(1, Math.ceil(pts.length / Math.max(2, Math.floor(iw/70))));
  pts.forEach((p,i) => { if (i%step===0) g += `<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(p.label)}</text>`; });
  const path = pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area = path + ` L${X(pts.length-1).toFixed(1)} ${Y(0)} L${X(0).toFixed(1)} ${Y(0)} Z`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Acessos ao longo do tempo"><g class="axis">${g}</g>
    <path d="${area}" fill="var(--bar)" opacity=".14"/><path d="${path}" fill="none" stroke="var(--bar)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="xh" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/><circle id="dot" r="4.5" fill="var(--bar)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    <rect x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('#tip'), xh = el.querySelector('#xh'), dot = el.querySelector('#dot');
  const move = ev => {
    const r = svg.getBoundingClientRect(); const px = ((ev.touches?ev.touches[0].clientX:ev.clientX) - r.left) * W / r.width;
    const i = Math.max(0, Math.min(pts.length-1, Math.round((px-m.l)/(iw/Math.max(1,pts.length-1)))));
    const x = X(i), y = Y(pts[i].v);
    xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.setAttribute('opacity',1);
    dot.setAttribute('cx',x); dot.setAttribute('cy',y); dot.setAttribute('opacity',1);
    tip.innerHTML = `${esc(pts[i].label)}<br><b>${nf(pts[i].v)}</b> acessos`; tip.style.left = (x*r.width/W)+'px'; tip.style.top = (y*r.height/H)+'px'; tip.style.opacity = 1;
  };
  const out = () => { tip.style.opacity = 0; xh.setAttribute('opacity',0); dot.setAttribute('opacity',0); };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerleave', out); svg.addEventListener('touchmove', move, {passive:true}); svg.addEventListener('touchend', out);
}

function render(S){
  if (S.fetched_at) $('#upd').textContent = 'Dados atualizados em ' + fmtDT(S.fetched_at) + ' · atualização automática a cada 10 minutos';
  if (S.error && !S.hits){

  const H = S.hits || [];

  const pdfTotal = pdfs.reduce((a,x)=>a+x.count,0), pdfP = pdfs.filter(x=>x.poster), pdfO = pdfs.filter(x=>!x.poster);

  const favList = favs.map(h => ({name: h.path.replace(/^favorito: /,''), count:h.count})).sort((a,b)=>b.count-a.count);
  const outros = [
    {name:'Baixou os anais (PDF 14 MB)', count: sum(/^anais: PDF/)},
    {name:'Baixou os anais (alta resolução)', count: sum(/^anais: alta/)},
    {name:'Tocou em "Instalar app" (Android)', count: sum(/^tocou em Instalar app$/)},
    {name:'Instalou o app', count: installs},
    {name:'Abriu os ingressos do evento social', count: sum(/^evento social: ingressos$/)},
    {name:'Importou favoritos da versão de teste', count: sum(/^importou favoritos do teste$/)}
  ].sort((a,b)=>b.count-a.count);
  const regs = (S.regions_br||[]).map(x => ({uf: ufOf(x), count: x.count, raw: x.name}));
  const byUF = {}; regs.forEach(r => { const k = r.uf || '?'; byUF[k] = (byUF[k]||0) + r.count; });
  const loc = Object.entries(byUF).map(([k,c]) => ({name: k === '?' ? 'Sem estado (antes do registro de estado ou não identificado)' : UF_NAME[k] + ' (' + k + ')', count: c})).sort((a,b)=>b.count-a.count);
  const countries = (S.locations||[]).map(x=>({name:COUNTRY[(x.id||'').toUpperCase()]||x.name||'Não identificado', count:x.count}));
  const sys = (S.systems||[]).map(x=>({name:SYS[x.name]||x.name||'Outro', count:x.count}));
  const br = (S.browsers||[]).map(x=>({name:x.name||'Outro', count:x.count}));
  const sizes = (S.sizes||[]).map(x=>({name:SIZE[x.id]||SIZE[x.name]||x.name||'Outro', count:x.count}));
  const refs = (S.toprefs||[]).map(x=>({name:REF(x.name), count:x.count}));

  $('#main').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="lab">Aberturas do app</div><div class="num">${nf(total)}</div><div class="sub">desde 23/10, versão oficial</div></div>
      <div class="kpi"><div class="lab">Pelo app instalado</div><div class="num">${pct}%</div><div class="split" title="App instalado: ${nf(viaApp)} · Navegador: ${nf(viaNav)}"><i style="width:${pct}%"></i></div><div class="sub">${nf(viaApp)} pelo ícone · ${nf(viaNav)} pelo navegador</div></div>
      <div class="kpi"><div class="lab">Instalações registradas</div><div class="num">${nf(installs)}</div><div class="sub">Android/computador; no iPhone não é registrado</div></div>
      <div class="kpi"><div class="lab">PDFs de trabalhos abertos</div><div class="num">${nf(pdfTotal)}</div><div class="sub">${nf(pdfP.reduce((a,x)=>a+x.count,0))} resumos estendidos · ${nf(pdfO.reduce((a,x)=>a+x.count,0))} ementas</div></div>
      <div class="kpi"><div class="lab">Downloads dos anais</div><div class="num">${nf(anais)}</div><div class="sub">as duas versões do PDF</div></div>
      <div class="kpi"><div class="lab">Favoritos marcados</div><div class="num">${nf(favTotal)}</div><div class="sub">em ${nf(favList.length)} atividades diferentes</div></div>
    </div>
    ${card('Acessos ao longo do tempo','Tudo que foi registrado no app (aberturas e uso), por hora ou por dia. Passe o dedo ou o mouse no gráfico para ver cada ponto.','<div class="chart" id="tl"><svg></svg></div>', '<div class="seg" role="group" aria-label="Agrupar por"><button type="button" data-m="hora" aria-pressed="true">Por hora</button><button type="button" data-m="dia" aria-pressed="false">Por dia</button></div>')}
    ${card('De onde acessam','Acessos por estado, identificados de forma aproximada pela conexão de internet (o contador não registra cidade). Cores mais fortes indicam mais acessos. Países: '+(countries.length?countries.map(c=>esc(c.name)+' '+nf(c.count)).join(' · '):'—'), `<div class="mapwrap"><div><div class="map" id="map"><div class="empty">Carregando mapa…</div></div><div class="legend" id="mapleg"></div></div><div>${rows(loc,{col:'Estado'})}</div></div>`)}
    ${card('Favoritos por dia e horário','Atividades marcadas com a estrela, agrupadas pelo horário em que acontecem, para ver quais disputam o mesmo público. Os horários seguem a programação atual (inclui as mudanças feitas depois da marcação). Só aparecem atividades que já receberam alguma estrela. A barra mostra quanto da lotação da sala as estrelas já ocupam: verde abaixo de 90%, amarela de 90% a 99% e vermelha a partir de 100% (sala lotada). Em amarelo: estrelas iguais ou acima de 90% da capacidade da sala.', '<div id="slots"></div>', '<div class="seg" role="group" aria-label="Dia" id="dayseg"></div>')}
    <div class="grid2">
      ${card('Resumos estendidos mais abertos','PDFs de pôsteres abertos pelo botão do card.', rows(pdfP,{max:15,col:'Pôster'}))}
      ${card('Ementas mais abertas','PDFs de apresentações orais abertos pelo botão do card.', rows(pdfO,{max:15,col:'Apresentação oral'}))}
      ${card('Atividades mais favoritadas','Quantas vezes cada atividade foi marcada com a estrela. Para ver por dia e horário, use o quadro “Favoritos por dia e horário”, acima.', rows(favList,{max:15,col:'Atividade'}))}
      ${card('Abas mais visitadas','', rows(abas,{col:'Aba'}))}
      ${card('Outras ações','', rows(outros,{col:'Ação'}))}
      ${card('Sistema do aparelho','', rows(sys,{col:'Sistema'}))}
      ${card('Tipo de aparelho','', rows(sizes,{col:'Aparelho'}))}
      ${card('Navegador','', rows(br,{col:'Navegador'}))}
      ${card('Por onde chegaram','Sites ou apps de onde veio o clique.', rows(refs,{col:'Origem'}))}
    </div>
    ${teste.length ? card('Versão de teste','Acessos que ainda chegam pelo endereço de teste.', rows(teste.map(h=>({name:h.path.replace(/^\[teste\] /,''), count:h.count})).sort((a,b)=>b.count-a.count),{max:6,col:'Item'})) : ''}
    <footer>Os números são anônimos: o app não usa cookies nem guarda dados pessoais, e ninguém é identificado. Acessos feitos sem internet e por quem usa bloqueador de anúncios podem não ser contados, então os valores mostram tendências, não uma contagem exata. Fonte: GoatCounter.${S.last_error ? ' Última tentativa de atualização falhou às '+fmtDT(S.last_try)+'; exibindo os dados anteriores.' : ''}</footer>`;

  drawMap(byUF);
  let mode = 'hora';
  const draw = () => lineChart($('#tl'), series(S.total && S.total.days, mode));
  draw();
  document.querySelectorAll('.seg button[data-m]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; document.querySelectorAll('.seg button[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); }));

  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { draw(); drawMesh(); }, 150); });

/* capacidade das salas (informada pela coordenação em 27/10) */
const CAPAC = {'Teatro Lupicínio Rodrigues':340,'Arena Elis Regina':77,'Auditório Augusto Meyer':42,'Sala João Simões Lopes Neto':35,'Sala Iberê Camargo':44,'Sala Mário Quintana':54,'Sala Moacyr Scliar':45,'Sala Érico Veríssimo':134,'Sala Dyonélio Machado':52,'Sala Josué Guimarães':64,'Sala Alcides Maya':43};
/* favoritos agrupados por dia e faixa de horário (programação atual em agenda.json) */
function initSlots(favList){
  const box = document.getElementById('slots'), seg = document.getElementById('dayseg'); if (!box) return;
  if (!AGENDA.length){ box.innerHTML = '<div class="empty">Programação indisponível no momento.</div>'; return; }
  const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const norm = x => (x||'').toLowerCase().replace(/\s+/g,' ').trim();
  // casa cada favorito com uma atividade da programação
  const items = new Map();
  favList.forEach(f => {
    const m = f.name.match(/^(.*?) – (.*)$/); if (!m) return;
    const pre = m[1], tt = norm(m[2]).replace(/…$/,''); let a = null;
    let pm = pre.match(/^Pôster (\d+)$/), dm = pre.match(/^(\d\d)\/10 (\d\d:\d\d)$/);
    if (pm) a = AGENDA.find(x => x.pid === pm[1]);
    else if (dm){ const d = +dm[1];
      a = AGENDA.find(x => !x.code && x.d === d && x.s === dm[2] && norm(x.title).startsWith(tt.slice(0,25))) ||
          AGENDA.find(x => !x.code && norm(x.title).startsWith(tt.slice(0,25))) ||
          {d, s: dm[2], e: dm[2], room: '', type: '', title: m[2], code: ''}; }
    else { const c = AGENDA.filter(x => x.code === pre); a = c.find(x => norm(x.title).startsWith(tt.slice(0,40))) || c[0]; }
    if (!a) return;
    const k = a.pid ? 'P'+a.pid : (a.code || '') + '|' + a.d + '|' + a.s + '|' + a.title;
    const cur = items.get(k) || {a, count: 0}; cur.count += f.count; items.set(k, cur);
  });
  const all = [...items.values()];
  const days = [...new Set(all.map(x => x.a.d))].sort((a,b)=>a-b);
  if (!days.length){ box.innerHTML = '<div class="empty">Ainda sem dados.</div>'; return; }
  const hoje = +new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',day:'2-digit'}).format(new Date());
  let cur = days.find(d => d >= hoje) ?? days[0];
  seg.innerHTML = days.map(d => `<button type="button" data-day="${d}" aria-pressed="${d===cur}">${d}/10</button>`).join('');
  const label = a => (a.pid ? 'Pôster ' + a.pid : (a.code ? a.code : a.type || 'Atividade'));
  const draw = () => {
    const list = all.filter(x => x.a.d === cur);
    // faixas: inícios das atividades de ~1 h da programação do dia (palestras), exceto pôsteres
    const bounds = [...new Set(AGENDA.filter(x => x.d === cur && !x.pid && !x.open && mins(x.e) - mins(x.s) >= 50 && mins(x.e) - mins(x.s) <= 130).map(x => mins(x.s)))].sort((a,b)=>a-b);
    const bEnd = b => Math.min(...AGENDA.filter(x => x.d === cur && !x.pid && !x.open && mins(x.s) === b && mins(x.e) - mins(x.s) >= 50 && mins(x.e) - mins(x.s) <= 130).map(x => mins(x.e)));
    const groups = new Map(), gEnd = {};
    list.forEach(it => {
      const st = mins(it.a.s);
      const b = [...bounds].reverse().find(b => b <= st && st < bEnd(b));
      const key = it.a.pid ? 'pos' : String(b ?? st);
      gEnd[key] = b !== undefined && !it.a.pid ? bEnd(b) : Math.max(gEnd[key] || 0, it.a.open ? st : mins(it.a.e));
      if (!groups.has(key)) groups.set(key, []); groups.get(key).push(it);
    });
    const keys = [...groups.keys()].sort((a,b) => (a==='pos'? mins('08:30') : +a) - (b==='pos'? mins('08:30') : +b));
    const hhmm = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
    const alertas = list.filter(x => CAPAC[x.a.room] && x.count / CAPAC[x.a.room] >= 0.9);
    const resumo = alertas.length ? `<div class="alertsum">⚠ <b>${alertas.length} ${alertas.length === 1 ? 'atividade' : 'atividades'}</b> neste dia com estrelas iguais ou acima de 90% da capacidade da sala.</div>` : '';
    box.innerHTML = resumo + keys.map(k => {
      const g = groups.get(k).sort((a,b)=>b.count-a.count), tot = g.reduce((s,x)=>s+x.count,0), mx = g[0].count;
      const ini = k === 'pos' ? '08:30' : hhmm(+k), fimM = k === 'pos' ? mins('10:00') : gEnd[k], fim = hhmm(fimM);
      const title = k === 'pos' ? 'Pôsteres · ' + ini + '–' + fim : (fimM > +k ? ini + '–' + fim : 'a partir das ' + ini);
      const row = x => { const cap = CAPAC[x.a.room], pc = cap ? x.count / cap : 0, al = cap && pc >= 0.9;
        return `<div class="srow${al ? ' alerta' : ''}"><span class="nm"><b>${esc(label(x.a))}</b> – ${esc(x.a.title)}</span><span class="mt">${esc(x.a.open ? 'a partir das ' + x.a.s : x.a.s + '–' + x.a.e)}${x.a.room ? ' · ' + esc(x.a.room) : ''}${cap ? ' · capacidade ' + nf(cap) : ''}</span><span class="ct">${nf(x.count)}</span>${al ? `<span class="cap">⚠ ${Math.round(pc*100)}% da capacidade da sala (${nf(x.count)} estrelas para ${nf(cap)} lugares)</span>` : ''}<span class="tr${cap ? (pc >= 1 ? ' lv-over' : pc >= 0.9 ? ' lv-warn' : ' lv-ok') : ''}" title="${cap ? Math.round(pc*100) + '% da lotação da sala' : 'comparado com a atividade mais favoritada do horário'}"><i style="width:${(cap ? Math.min(pc,1)*100 : x.count/mx*100).toFixed(1)}%"></i></span></div>`; };
      const lim = k === 'pos' ? 8 : 99, head = g.slice(0, lim), rest = g.slice(lim);
      return `<div class="slot"><div class="slothead"><span class="hr">${title}</span><span class="tot">${nf(tot)} ${tot===1?'estrela':'estrelas'} · ${g.length} ${g.length===1?'atividade':'atividades'}</span>${k !== 'pos' && g.length > 1 ? '<span class="conc">mesmo horário</span>' : ''}${(() => { const n = g.filter(x => CAPAC[x.a.room] && x.count / CAPAC[x.a.room] >= 0.9).length; return n ? `<span class="alc">⚠ ${n} perto da lotação</span>` : ''; })()}</div>${head.map(row).join('')}${rest.length ? `<details><summary>Ver mais ${rest.length} pôsteres</summary>${rest.map(row).join('')}</details>` : ''}</div>`;
    }).join('');
  };
  seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { cur = +b.dataset.day; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); }));
  draw();
}

/* títulos dos trabalhos (índice dos PDFs) para dar nome aos PDFs abertos */
const TRAB = {};
const loadTrab = fetch('../trabalhos/INDICE.csv?t=' + Date.now(), {cache:'no-store'}).then(r => r.text()).then(txt => {
  const rowsCsv = []; let row = [], f = '', q = false;
  for (let i = 0; i < txt.length; i++){ const c = txt[i];
    if (q){ if (c === '"' && txt[i+1] === '"'){ f += '"'; i++; } else if (c === '"') q = false; else f += c; }
    else if (c === '"') q = true; else if (c === ','){ row.push(f); f = ''; } else if (c === '\n' || c === '\r'){ if (c === '\r' && txt[i+1] === '\n') i++; row.push(f); rowsCsv.push(row); row = []; f = ''; } else f += c; }
  if (f || row.length){ row.push(f); rowsCsv.push(row); }
  rowsCsv.slice(1).forEach(r => { if (r.length < 3) return; const poster = /p[oô]ster/i.test(r[0]); const id = poster ? 'POS-' + r[1] : r[1];
    let tit = r[2]; if (poster && tit === tit.toUpperCase()) tit = tit.charAt(0) + tit.slice(1).toLowerCase();
    TRAB[id] = {rot: poster ? 'Pôster ' + r[1] : r[1], tit: tit.length > 80 ? tit.slice(0, 78) + '…' : tit}; });
}).catch(() => {});
let AGENDA = [];
const loadAgenda = fetch('agenda.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(j => { AGENDA = j.itens || []; }).catch(() => {});
Promise.all([fetch('stats.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.json()), loadTrab, loadAgenda]).then(([S]) => S).then(render).catch(() => {
  $('#upd').textContent = 'Não foi possível carregar os dados agora.';
  $('#main').innerHTML = '<div class="notice"><h2>Sem dados no momento</h2><p>Tente recarregar a página em alguns instantes.</p></div>';
});
