<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8B0000">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Programação CNC 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Programação oficial do XXVIII Congresso Nacional de Criminalística — 27 a 30 de outubro de 2026, Gramado/RS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600&family=Sora:wght@400;600;700&display=swap">
<style>
/* Layout: cabeçalho fixo vermelho/preto como o site oficial; conteúdo em coluna única (máx. 760px), cartões por horário */
:root{
  --brand:#8B0000; --brand-2:#C10000; --brand-deep:#5A0000; --salmon:#EC7969; --gold:#F2C230;
  --nav:#141414; --nav-fg:#F2F2F2; --nav-muted:#A9A9A9;
  --bg:#F6F2F1; --surface:#FFFFFF; --surface-2:#F1EAE9; --fg:#1C1516; --muted:#6B5F60; --line:#E4D8D7;
  --accent:#A30F12; --accent-soft:#FBE7E4; --now:#0E7A43; --now-soft:#E2F4EA; --warn:#9A5B00; --warn-soft:#FFF1D6;
  --shadow:0 1px 2px rgba(60,10,10,.06),0 4px 14px rgba(60,10,10,.05);
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120E0E; --surface:#1C1617; --surface-2:#251E1F; --fg:#F2EBEB; --muted:#AD9FA0; --line:#352B2C;
  --accent:#F0857A; --accent-soft:#3A1A1A; --now:#5FD39A; --now-soft:#15301F; --warn:#F1B65A; --warn-soft:#33260F;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120E0E; --surface:#1C1617; --surface-2:#251E1F; --fg:#F2EBEB; --muted:#AD9FA0; --line:#352B2C;
  --accent:#F0857A; --accent-soft:#3A1A1A; --now:#5FD39A; --now-soft:#15301F; --warn:#F1B65A; --warn-soft:#33260F;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--salmon);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brandbar{background:var(--brand);color:#fff}
.brandbar .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.logo{height:40px;width:auto;display:block;flex:0 0 auto}
.brandbar .ttl{margin-left:auto;text-align:right}
.mark{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:.02em;line-height:1;display:flex;align-items:flex-end;gap:4px}
.mark small{font-size:13px;font-weight:500;color:var(--gold);letter-spacing:.08em;padding-bottom:2px}
.brandbar .ttl{font-size:13px;line-height:1.25;opacity:.92;min-width:0}
.brandbar .ttl b{display:block;font-weight:600}
.tabs{background:var(--nav)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;color:var(--nav-muted);font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:12px 10px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--nav-fg);border-bottom-color:var(--salmon)}
.tab .n{font-family:var(--f-body);font-size:12px;font-weight:600;background:var(--salmon);color:#2a0606;border-radius:999px;padding:1px 6px;margin-left:5px;letter-spacing:0;vertical-align:2px}

/* Barra de filtros ativos */
.active-filters{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.active-filters .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:8px;font-size:14px}
.active-filters .lbl{font-weight:600;color:var(--accent);margin-right:2px}
.af-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 4px 2px 10px;font-size:13.5px;cursor:pointer}
.af-chip span.x{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-2);font-size:14px;line-height:1}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;padding:2px 4px;font-size:14px}

main{padding-bottom:48px}
section.view{padding-top:16px}

/* Início */
.hero{background:radial-gradient(120% 90% at 85% 10%,var(--brand-2) 0%,var(--brand) 45%,var(--brand-deep) 100%);color:#fff;position:relative;overflow:hidden}
.hero-logo{width:min(420px,88%);height:auto;display:block;margin:10px 0 22px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.hero .wrap{position:relative;padding-block:28px 26px}
.eyebrow{font-family:var(--f-display);font-weight:300;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:#FFD7CF}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,8vw,46px);line-height:1.02;margin:8px 0 10px;text-wrap:balance;letter-spacing:.01em;text-transform:uppercase}
.hero p{margin:0;max-width:52ch;font-size:15.5px;opacity:.95}
.daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.daybtn{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:var(--r);padding:10px 6px;cursor:pointer;text-align:center}
.daybtn b{display:block;font-family:var(--f-display);font-size:24px;font-weight:500;line-height:1}
.daybtn span{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.daybtn.today{background:#fff;color:var(--brand)}
.nowbar{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px}
.nowbar button{background:var(--gold);color:#2a1a00;border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}

.block{margin-top:28px}
.block h2{font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:20px;margin:0 0 10px;color:var(--accent)}
.prose p{margin:0 0 10px;max-width:65ch}
.info{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.info li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px}
.info li b{font-family:var(--f-display);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:560px){.legend{grid-template-columns:1fr 1fr}}
.legend button{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;text-align:left;font-size:14.5px}
.legend button:hover{border-color:var(--accent)}
.flags-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fl-lbl{font-weight:600;font-size:14px;align-self:center;margin-right:2px}
.orgs{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:560px){.orgs{grid-template-columns:1fr 1fr}}
.org{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:15px}
.org .role{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.org .inst{color:var(--muted)}
.subh{font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:.05em;font-size:17px;margin:22px 0 10px}
.committee{display:grid;gap:14px}
.committee .grp h3{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.committee ul{margin:0;padding:0;list-style:none;font-size:14.5px;color:var(--muted)}
.committee li strong{color:var(--fg);font-weight:600}
.dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.note{font-size:13.5px;color:var(--muted)}

/* Etiquetas */
.tag{display:inline-block;background:var(--c);color:var(--t);font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.04em;padding:1px 7px;border-radius:5px;line-height:1.45;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);white-space:nowrap}
.tag.sinab{--c:#FFFFFF;--t:#E8541C;display:inline-flex;align-items:center;font-weight:500;letter-spacing:.06em;box-shadow:inset 0 0 0 1px #F2B9A2}
.tag.sinab svg{width:.42em;height:1.15em;margin:0 .05em;flex:0 0 auto}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.flag svg{width:13px;height:13px}

/* Dia */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.dayhead h2{font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:.05em;font-size:24px;margin:0}
.dayhead .meta{font-size:14px;color:var(--muted)}
.slot{margin-top:18px}
.slot-h{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,96px));z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:6px 0;font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.slot-h::after{content:"";flex:1;height:1px;background:var(--line)}
.slot-h .live{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--now);background:var(--now-soft);border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.06em}
.brk{margin-top:18px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.brk::before,.brk::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.brk b{font-variant-numeric:tabular-nums;font-weight:600}
.list{display:grid;gap:10px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:2px 8px;min-width:0}
.ev.dim{background:var(--surface-2);box-shadow:none}
.ev.is-now{border-color:var(--now);box-shadow:0 0 0 1px var(--now) inset}
.ev-main{min-width:0}
.ev-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13.5px;color:var(--muted)}
.ev-top .type{font-weight:600;color:var(--fg)}
.ev-top .time{font-variant-numeric:tabular-nums}
.ev-top .nowpill{color:var(--now);background:var(--now-soft);font-weight:700;border-radius:999px;padding:0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.ev h3{font-size:16.5px;line-height:1.35;font-weight:600;margin:6px 0 4px;text-wrap:pretty;overflow-wrap:anywhere}
.ev .ppl{font-size:14.5px;color:var(--fg);margin:0 0 4px;overflow-wrap:anywhere}
.ev .ppl span{display:block}
.ev .room{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-top:2px}
.ev .room svg{width:14px;height:14px;flex:0 0 auto}
.ev .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ev .kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kw{border:1px solid var(--line);background:transparent;border-radius:999px;font-size:13px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.kw:hover,.kw.on{border-color:var(--accent);color:var(--accent)}
.kw.on{background:var(--accent-soft)}
.fav{grid-row:1/span 2;grid-column:2;align-self:start;background:none;border:0;padding:6px;margin:-6px -6px 0 0;cursor:pointer;color:var(--muted);border-radius:8px;width:40px;height:40px;display:grid;place-items:center}
.fav svg{width:24px;height:24px}
.fav[aria-pressed="true"]{color:#E2A400}
.fav[aria-pressed="true"] svg path{fill:currentColor}
.conflict{margin-top:8px;font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 8px;display:inline-block}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);margin-top:16px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* Filtros */
.search{position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:12px 40px 12px 42px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:20px}
.results{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,96px));z-index:4;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.results .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.results .count{font-weight:600}
.results .days{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.results .days button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.results .days button b{color:var(--accent)}
.results .days button:disabled{opacity:.45;cursor:default}
fieldset{border:0;padding:0;margin:20px 0 0;min-width:0}
legend{font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:17px;color:var(--accent);padding:0;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;width:100%}
legend .linkbtn{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13.5px}
.checks{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:560px){.checks.two{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;cursor:pointer;font-size:15px;min-width:0}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--brand);flex:0 0 auto}
.chk .lab{flex:1;min-width:0;overflow-wrap:anywhere}
.chk .c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14.5px;font-variant-numeric:tabular-nums}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.pill:has(input:focus-visible){outline:2px solid var(--salmon)}
.subsearch{width:100%;font:inherit;font-size:16px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);margin-bottom:8px}
.kwbox{max-height:340px;overflow:auto;padding-right:2px}
.more{margin-top:8px}

footer{margin-top:36px;padding-block:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>

/* ---------- dados normalizados ---------- */
const EV = [];
EVENTS.forEach((r, i) => {
  const [d,s,e,room,code,type,title,people,kw,flags] = r;
  const pre = code ? code.split('.')[0] : '';
  const areas = [];
  if (AREAS[pre]) areas.push(pre);
  (EXTRA_AREAS[code]||[]).forEach(a => { if (!areas.includes(a)) areas.push(a); });
  if (type === 'S') areas.push('BA');
  if (type === 'S' || flags.includes('s')) areas.push('SN');
  let id = code ? code : `${d}-${room||'x'}-${s}`;
  if (code && EVENTS.filter(x => x[4] === code).length > 1) id = `${code}@${d}-${s}`;
  const kws = kw ? kw.split('|') : [];
  const ev = { i, id, d, s, e, sm:mins(s), em:mins(e), room, code, type, title, people: people ? people.split(';;') : [], kws, flags, areas };
  ev.hay = norm([code, title, people, kw, ROOMS[room]?.n||'', ROOMS[room]?.x||'', TYPES[type], areas.map(a=>AREAS[a].n).join(' ')].join(' '));
  EV.push(ev);
});
const ALL_KW = (() => { const m = new Map(); EV.forEach(e => e.kws.forEach(k => m.set(k, (m.get(k)||0)+1))); return [...m].sort((a,b) => a[0].localeCompare(b[0],'pt')); })();

const PERIODS = {manha:['Manhã',0,mins('12:30')], tarde:['Tarde',mins('12:30'),mins('18:25')], noite:['Noite',mins('18:25'),24*60]};

  periods: new Set(saved.periods||[]), slots: new Set(saved.slots||[]), kws: new Set(saved.kws||[])
};

function saveF(){ store.set('cnc26_filters', {q:F.q, areas:[...F.areas], types:[...F.types], rooms:[...F.rooms], periods:[...F.periods], slots:[...F.slots], kws:[...F.kws]}); }
function hasFilters(){ return !!F.q.trim() || F.areas.size || F.types.size || F.rooms.size || F.periods.size || F.slots.size || F.kws.size; }
function match(e){
  if (e.type === 'B') return false;
  if (F.areas.size && !e.areas.some(a => F.areas.has(a))) return false;
  if (F.types.size && !F.types.has(e.type)) return false;
  if (F.rooms.size && !F.rooms.has(e.room)) return false;
  if (F.kws.size && !e.kws.some(k => F.kws.has(k))) return false;
  if (F.periods.size && ![...F.periods].some(p => { const [,a,b] = PERIODS[p]; return e.sm < b && e.em > a; })) return false;
  if (F.slots.size && ![...F.slots].some(t => { const m = mins(t); return e.sm <= m && m < e.em; })) return false;
  if (F.q.trim()) { const words = norm(F.q).split(/\s+/).filter(Boolean); if (!words.every(w => e.hay.includes(w))) return false; }
  return true;
}

/* ---------- horário de Brasília ---------- */
function nowSP(){
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
    const isCongress = p.year === '2026' && p.month === '10' && +p.day >= 27 && +p.day <= 30;
    return { day: isCongress ? +p.day : null, m: +p.hour*60 + +p.minute, hm: `${p.hour}:${p.minute}` };
  }catch(e){ return {day:null,m:0,hm:''}; }
}

function tagHTML(e){
  const sn = e.areas.includes('SN') ? SINAB_TAG : '';
  if (e.code){ const a = AREAS[e.areas[0]] || AREAS.OE; const extra = (EXTRA_AREAS[e.code]||[]).map(k => `<span class="tag" style="--c:${AREAS[k].c};--t:${AREAS[k].t}">${k}</span>`).join(''); return `<span class="tag" style="--c:${a.c};--t:${a.t}">${esc(e.code)}</span>${extra}${sn}`; }
  if (e.type === 'S') return `<span class="tag" style="--c:${AREAS.BA.c};--t:${AREAS.BA.t}">BA</span>${sn}`;
  return '';
}
function card(e, opts = {}){
  const now = opts.now, isNow = now && now.day === e.d && e.sm <= now.m && now.m < e.em;
  const dim = ['I','T','V'].includes(e.type);
  const room = ROOMS[e.room];
  const fav = FAV.has(e.id);
  const people = e.people.map(p => `<span>${e.type === 'O' ? esc(p).replace(/ - (apresentadora?)\b/g,' - <em>$1</em>') : esc(p)}</span>`).join('');
  const flags = [...e.flags].filter(f => FLAGS[f]).map(f => `<span class="flag"><svg viewBox="0 0 24 24" aria-hidden="true">${FLAGS[f].i}</svg>${FLAGS[f].t}</span>`).join('');
  const sinab = '';
  const kws = e.kws.filter(k => k !== 'Pôsteres').map(k => `<button class="kw${F.kws.has(k)?' on':''}" data-kw="${esc(k)}">${esc(k)}</button>`).join('');
  const minicurso = e.type === 'M' && e.sm === mins('13:00') ? ' · intervalo 15:00–15:15' : '';
  return `<article class="ev${dim?' dim':''}${isNow?' is-now':''}" data-id="${esc(e.id)}">
    <div class="ev-main">
      <div class="ev-top">${tagHTML(e)}<span class="type">${TYPES[e.type]}</span><span class="time">${opts.showDay?`${e.d}/10 · `:''}${e.s}–${e.e}${minicurso}</span>${isNow?'<span class="nowpill">Agora</span>':''}</div>
      <h3>${esc(e.title)}</h3>
      ${people?`<p class="ppl">${people}</p>`:''}
      ${room?`<div class="room">${ICON_PIN}<span>${esc(room.n)}${room.x?` (${room.x})`:''}</span></div>`:''}
      ${flags||sinab?`<div class="flags">${sinab}${flags}</div>`:''}
      ${kws?`<div class="kws">${kws}</div>`:''}
      ${opts.conflict?`<div class="conflict">Conflito de horário com ${esc(opts.conflict)}</div>`:''}
    </div>
    ${e.type === 'B' ? '' : `<button class="fav" data-fav="${esc(e.id)}" aria-pressed="${fav}" aria-label="${fav?'Remover dos':'Adicionar aos'} favoritos">${ICON_STAR}</button>`}
  </article>`;
}

function drawMesh(){
  const c = $('#mesh'); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio||1);
  c.width = r.width*dpr; c.height = r.height*dpr;
  const x = c.getContext('2d'); x.scale(dpr,dpr);
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const W = r.width, H = r.height, pts = [];
  const n = Math.round(Math.min(70, W/9));
  for (let i=0;i<n;i++){ const px = W*0.45 + rnd()*W*0.58, py = rnd()*H; pts.push([px,py]); }
  x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = .7;
  for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){ const dx=pts[i][0]-pts[j][0], dy=pts[i][1]-pts[j][1]; if (dx*dx+dy*dy < 70*70){ x.beginPath(); x.moveTo(...pts[i]); x.lineTo(...pts[j]); x.stroke(); } }
  pts.forEach(([px,py],i) => { x.fillStyle = i%11===0 ? '#F2C230' : 'rgba(255,255,255,.8)'; x.beginPath(); x.arc(px,py,i%11===0?2.6:1.6,0,7); x.fill(); });
}

function kwChecks(){
  const q = norm(kwQuery);
  const list = ALL_KW.filter(([k]) => k !== 'Pôsteres' && (!q || norm(k).includes(q)));

}
function resultsHTML(counts,total){
  if (!counts){ counts = DAYS.map(x => [x.d, EV.filter(e => e.d === x.d && match(e)).length]); total = counts.reduce((a,[,n]) => a+n, 0); }
  const fil = hasFilters();
  return `<div class="row"><span class="count">${fil ? `${total} ${total===1?'atividade encontrada':'atividades encontradas'}` : 'Nenhum filtro aplicado'}</span>${fil?'<button class="linkbtn" data-clear>Limpar tudo</button>':''}</div>
    <div class="days">${counts.map(([d,n]) => `<button data-go="dia${d}" ${fil&&!n?'disabled':''}>${d}/10 ${fil?`<b>${n}</b>`:''}</button>`).join('')}</div>`;
}

/* ---------- Dia ---------- */
function renderDia(){
  const now = nowSP();
  const day = DAYS.find(x => x.d === curDay);
  const fil = hasFilters();
  const items = EV.filter(e => e.d === curDay && match(e));
  const breaks = fil ? [] : EV.filter(e => e.d === curDay && e.type === 'B');
  const sortRoom = (a,b) => a.sm - b.sm || ROOM_ORDER.indexOf(a.room) - ROOM_ORDER.indexOf(b.room);
  items.sort(sortRoom);
  const groups = new Map();
  items.forEach(e => { if (!groups.has(e.s)) groups.set(e.s, []); groups.get(e.s).push(e); });
  const seq = [...groups.entries()].map(([s,l]) => ({k:'g', m:mins(s), s, l})).concat(breaks.map(b => ({k:'b', m:b.sm, b}))).sort((a,b) => a.m - b.m || (a.k==='b'?-1:1));
  const isToday = now.day === curDay;
  let html = `<div class="dayhead"><h2>${day.w}, ${curDay}/10</h2><span class="meta">${fil ? `${items.length} ${items.length===1?'atividade':'atividades'} com os filtros` : `${items.length} atividades`}${day.sub?` · ${day.sub}`:''}</span></div>`;
  if (!items.length){
    html += `<div class="empty"><b>Nada neste dia com os filtros atuais.</b>Experimente outro dia ou ajuste os filtros. <button class="linkbtn" data-clear>Limpar filtros</button></div>`;
  }
  let nowAnchor = null;
  seq.forEach(x => {
    if (x.k === 'b'){ html += `<div class="brk"><span><b>${x.b.s}–${x.b.e}</b> · ${esc(x.b.title)}</span></div>`; return; }
    const live = isToday && x.l.some(e => e.sm <= now.m && now.m < e.em);
    if (isToday && !nowAnchor && (live || x.m > now.m)) nowAnchor = x.s;
    html += `<div class="slot" id="t${x.s.replace(':','')}"><div class="slot-h">${x.s}${live?'<span class="live">em andamento</span>':''}</div><div class="list">${x.l.map(e => card(e,{now})).join('')}</div></div>`;
  });
  html += `<footer>Programação sujeita a alterações.${fil?'':' Intervalos aparecem quando nenhum filtro está aplicado.'}</footer>`;
  $('#v-dia').innerHTML = html;
  return nowAnchor;
}

/* ---------- Favoritos ---------- */
function renderFavoritos(){
  const favs = EV.filter(e => FAV.has(e.id)).sort((a,b) => a.d - b.d || a.sm - b.sm);
  let html = `<div class="dayhead"><h2>Meus favoritos</h2><span class="meta">${favs.length} ${favs.length===1?'atividade':'atividades'} · salvos neste aparelho</span></div>`;
  if (!favs.length){
    html += `<div class="empty"><b>Você ainda não marcou nenhuma atividade.</b>Toque na estrela de uma palestra, mesa ou minicurso para guardá-la aqui. <button class="linkbtn" data-go="dia28">Ver programação de 28/10</button></div>`;
  }
  const now = nowSP();
  DAYS.forEach(x => {
    const l = favs.filter(e => e.d === x.d); if (!l.length) return;
    html += `<div class="slot"><div class="slot-h">${x.d}/10 · ${x.w}</div><div class="list">${l.map(e => {
      const c = l.find(o => o !== e && o.sm < e.em && e.sm < o.em);
      return card(e,{now, conflict: c ? (c.code || c.title.slice(0,40)) + ` (${c.s}–${c.e})` : ''});
    }).join('')}</div></div>`;
  });
  if (favs.length) html += `<footer>Os favoritos ficam guardados no navegador deste aparelho. Se trocar de celular ou limpar os dados do navegador, será preciso marcar de novo.</footer>`;
  $('#v-favoritos').innerHTML = html;
}

/* ---------- navegação ---------- */
function go(k, opts = {}){
  if (k.startsWith('dia')){ view = 'dia'; curDay = +k.slice(3); }
  else view = k;
  ['inicio','filtros','dia','favoritos'].forEach(v => $('#v-'+v).hidden = v !== view);
  let anchor = null;
  if (view === 'inicio') renderInicio();
  if (view === 'filtros') renderFiltros();
  if (view === 'dia') anchor = renderDia();
  if (view === 'favoritos') renderFavoritos();
  $('#tabs').innerHTML = tabsHTML();
  renderAF(); measureHeader();
  const sel = $('#tabs [aria-selected="true"]'); if (sel) sel.scrollIntoView({block:'nearest',inline:'center'});
  try{ history.replaceState(null,'','#'+(view==='dia'?'dia'+curDay:view)); }catch(e){}
  if (opts.toNow && anchor){ const el = document.getElementById('t'+anchor.replace(':','')); if (el){ window.scrollTo(0, el.getBoundingClientRect().top + scrollY - $('#hdr').offsetHeight - 4); return; } }
  if (!opts.keepScroll) window.scrollTo(0,0);
}
function refresh(){ // re-render keeping scroll position
  const y = scrollY;
  if (view === 'filtros'){ $('#results').innerHTML = resultsHTML(); $('#tabs').innerHTML = tabsHTML(); return; }
  go(view === 'dia' ? 'dia'+curDay : view, {keepScroll:true});
  window.scrollTo(0,y);
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-go],[data-fav],[data-kw],[data-rm],[data-clear],[data-clrset],[data-clrq],[data-area],[data-now]');
  if (!t) return;
  if (t.dataset.go){ go(t.dataset.go); return; }
  if (t.dataset.fav){
    const id = t.dataset.fav; FAV.has(id) ? FAV.delete(id) : FAV.add(id); store.set('cnc26_favs',[...FAV]);
    if (view === 'favoritos') refresh();
    else { const on = FAV.has(id); t.setAttribute('aria-pressed', on); t.setAttribute('aria-label', (on?'Remover dos':'Adicionar aos')+' favoritos'); $('#tabs').innerHTML = tabsHTML(); }
    return;
  }
  if (t.dataset.kw){ const k = t.dataset.kw; F.kws.has(k) ? F.kws.delete(k) : F.kws.add(k); saveF(); refresh(); return; }
  if (t.dataset.rm){ const k = t.dataset.rm; if (k === 'q') F.q = ''; else F[k].delete(t.dataset.v); saveF(); refresh(); return; }
  if (t.hasAttribute('data-clear')){ F.q=''; ['areas','types','rooms','periods','slots','kws'].forEach(k => F[k].clear()); saveF(); view==='filtros' ? go('filtros',{keepScroll:true}) : refresh(); return; }
  if (t.dataset.clrset){ t.dataset.clrset.split(',').forEach(k => F[k].clear()); saveF(); const y=scrollY; go('filtros',{keepScroll:true}); window.scrollTo(0,y); return; }
  if (t.hasAttribute('data-clrq')){ F.q=''; saveF(); const i=$('#q'); i.value=''; t.hidden=true; refresh(); i.focus(); return; }
  if (t.dataset.area){ F.areas.clear(); F.areas.add(t.dataset.area); saveF(); go('filtros'); return; }
  if (t.hasAttribute('data-now')){ const n = nowSP(); if (n.day) go('dia'+n.day,{toNow:true}); return; }
});
document.addEventListener('change', ev => {
  const i = ev.target; if (!i.dataset || !i.dataset.f) return;
  const set = F[i.dataset.f]; i.checked ? set.add(i.value) : set.delete(i.value);
  saveF(); refresh();
  const lg = i.closest('fieldset')?.querySelector('legend');
  if (lg){ const has = i.dataset.f==='periods'||i.dataset.f==='slots' ? (F.periods.size||F.slots.size) : set.size; const b = lg.querySelector('.linkbtn'); if (has && !b) lg.insertAdjacentHTML('beforeend', `<button class="linkbtn" data-clrset="${i.dataset.f==='periods'||i.dataset.f==='slots'?'periods,slots':i.dataset.f}">limpar</button>`); if (!has && b) b.remove(); }
});
let qT;
document.addEventListener('input', ev => {
  if (ev.target.id === 'q'){ F.q = ev.target.value; $('[data-clrq]').hidden = !F.q; clearTimeout(qT); qT = setTimeout(() => { saveF(); refresh(); }, 180); }
  if (ev.target.id === 'kwq'){ kwQuery = ev.target.value; $('#kwbox').innerHTML = kwChecks(); }
});
document.addEventListener('keydown', ev => { if (ev.target.id === 'q' && ev.key === 'Enter'){ ev.target.blur(); } });
window.addEventListener('resize', () => { measureHeader(); if (view === 'inicio') drawMesh(); });
setInterval(() => { if (view === 'dia' && nowSP().day === curDay) refresh(); }, 60000);

/* ---------- início ---------- */
(function boot(){
  const h = (location.hash||'').slice(1);
  const valid = ['inicio','filtros','favoritos','dia27','dia28','dia29','dia30'];
  const n = nowSP();
  if (valid.includes(h)) go(h);
  else if (n.day) go('dia'+n.day, {toNow:true});
  else go('inicio');
})();
</script>
