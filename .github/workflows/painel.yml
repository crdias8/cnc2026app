name: Atualizar painel de acessos
on:
  schedule:
    - cron: '10,40 * * * *'   # a cada 30 min
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: painel
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encerrar depois de 01/11/2026
        id: prazo
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-11-02T03:00:00Z' +%s)" ]; then echo "fim=1" >> "$GITHUB_OUTPUT"; echo "Painel encerrado (prazo: 01/11/2026)"; fi
      - name: Buscar estatísticas do GoatCounter
        if: steps.prazo.outputs.fim != '1'
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/painel_stats.py
      - name: Publicar se mudou
        if: steps.prazo.outputs.fim != '1'
        run: |
          git config user.name "painel-cnc2026"
          git config user.email "painel-cnc2026@users.noreply.github.com"
          git add painel/stats.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Painel: estatísticas atualizadas"
          cp painel/stats.json "$RUNNER_TEMP/stats.json"
          # até 4 tentativas: traz o que chegou ao repositório no meio tempo e reenvia
          # (em conflito, fica o stats.json recém-buscado do GoatCounter; os demais arquivos ficam como estão no repositório)
          for i in 1 2 3 4; do
            git fetch -q origin main
            if ! git rebase -q -X theirs FETCH_HEAD; then git rebase --abort; git reset -q --hard FETCH_HEAD; cp "$RUNNER_TEMP/stats.json" painel/stats.json; git add painel/stats.json; git commit -q -m "Painel: estatísticas atualizadas" || true; fi
            if git push -q origin HEAD:main; then echo "publicado (tentativa $i)"; exit 0; fi
            echo "envio recusado, tentando de novo"; sleep $((i*10))
          done
          echo "não foi possível publicar"; exit 1
